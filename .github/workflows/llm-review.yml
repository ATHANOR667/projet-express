name: Revue de Code par IA (LLM) et Notification

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: 1. Checkout du Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Calcul du Diff de la PR
        id: diff
        run: |
          DIFF=$(git diff ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          
          echo "PR_DIFF<<EOF" >> $GITHUB_ENV
          echo "$DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 3. ÉTAPE CORRIGÉE : Utilise actions/github-script pour l'appel API et crée une sortie (output)
      - name: 3. Appel à l'IA (Gemini API) et Récupération de la Revue
        id: llm_call
        uses: actions/github-script@v7
        with:
          script: |
            // Configuration et récupération des données
            const diff = process.env.PR_DIFF;
            const apiKey = process.env.GEMINI_API_KEY;
            const modelName = 'gemini-2.5-flash';

            const prompt = `Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, fournis des pistes d'amélioration. Si le code contient des bugs, liste-les. Réponds en français. Voici le diff:\n${diff}`;

            // Appel de l'API Gemini
            async function getGeminiReview() {
              const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + apiKey, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  contents: [{ role: "user", parts: [{ text: prompt }] }],
                  config: {
                      systemInstruction: "Tu es un relecteur de code expert. Réponds en français. Ne réponds qu'avec la revue de code.",
                      temperature: 0.1
                  }
                }),
              });

              const data = await response.json();
            
              if (!response.ok || !data.candidates || data.candidates.length === 0) {
                 console.error('Erreur de l\'API Gemini:', data);
                 return `❌ Erreur de l'API Gemini. Statut : ${response.status}. Vérifiez la clé API et les logs.`;
              }

              return data.candidates[0].content.parts[0].text;
            }
            
            const llmResponse = await getGeminiReview();
            
            // Stocke la réponse comme sortie de cette étape pour les suivantes
            core.setOutput('llm_response', llmResponse);

        env:
          PR_DIFF: ${{ env.PR_DIFF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 4. Commenter sur la Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            // Récupère la sortie de l'étape 3
            const llmResponse = `${{ steps.llm_call.outputs.llm_response }}`; 
            const comment = `🤖 **Revue de code automatisée par LLM :**\n\n${llmResponse}\n\n*Review effectuée pour @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 5. Envoyer la Notification par Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          body: |
            Voici la revue générée par l'IA :
            ${{ steps.llm_call.outputs.llm_response }}

          # 👈 CORRECTION : Assurer la bonne indentation et la présence de 'from'
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: ${{ secrets.MAIL_USERNAME }}
          convert_markdown: true